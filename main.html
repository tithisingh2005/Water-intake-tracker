<!DOCTYPE html>
<html lang="en">    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water intake tracker</title>
<link rel="stylesheet" href="style.css">
    </head>
<body>
    <div class="app">
        <h1>Water Intake Tracker </h1>
        <p class="description">Track your daily water intake and stay hydrated</p>

        <div class="content">
            <!-- LEFT SIDE: BUTTONS -->
            <div class="buttons">
                <button onclick="addWater(100)">+ 100 ml</button>
                <button onclick="addWater(250)">+ 250 ml</button>
                <button onclick="addWater(500)">+ 500 ml</button>
                <button id="reset" onclick="resetWater()">Reset</button>
            </div>

            <!-- RIGHT SIDE: TOTAL DISPLAY -->
            <div class="status">
    <h2>Total Water</h2>
    <p id="totalWater">0 ml</p>

    
</div>

        </div>
    </div>

    <script src="main.js"></script>
</body>

</html>
